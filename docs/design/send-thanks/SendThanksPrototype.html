  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // Done on elements: cutting the markup text could rejoin a split closing tag.
    const stripPins = (root) => {
      for (const el of root.querySelectorAll('[integrity], [crossorigin], template')) {
        el.removeAttribute('integrity');
        el.removeAttribute('crossorigin');
        if (el.localName === 'template' && el.content) stripPins(el.content);
      }
    };
    stripPins(doc);
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n>\n                      <span style=\"font-size:13px;font-weight:700;color:{{ r.color }};margin-left:auto\">{{ r.foundLabel }}<\u002Fspan>\n                      <span style=\"flex-basis:100%;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#3D3832;overflow-wrap:anywhere\">{{ r.value }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showBlock }}\" hint-placeholder-val=\"{{ true }}\">\n        <section aria-label=\"Block list\" style=\"order:4;background:#FBF9F5;border:2px solid #1C1916;border-radius:18px;box-shadow:0 3px 0 #1C1916;overflow:hidden;min-width:0\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:2px solid #1C1916;min-height:60px;box-sizing:border-box\">\n            <div style=\"display:flex;align-items:baseline;flex-wrap:wrap;column-gap:10px;row-gap:2px;min-width:0\"><h2 style=\"margin:0;white-space:nowrap;line-height:1.2;font-size:19px;font-weight:800\">Block list<\u002Fh2><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6B6359;white-space:nowrap\">{{ blockMeta }}<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{ overview }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" sc-camel-on-click=\"{{ seeBlock }}\" style=\"height:{{ tapH }};padding:0 12px;border-radius:10px;border:2px solid #1C1916;background:#FBF9F5;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0\" style-hover=\"background:#F4EEE3\">See all<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ fullBlock }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:flex;flex-direction:column;gap:6px;padding:14px 20px;border-bottom:1px solid #E3DCD0\"><span style=\"font-size:14px;font-weight:700\">Search the block list<\u002Fspan><input type=\"search\" value=\"{{ q }}\" sc-camel-on-change=\"{{ onQ }}\" placeholder=\"Type an email address\" style=\"height:44px;padding:0 14px;border:2px solid #1C1916;border-radius:12px;background:#FFFFFF;font-size:16px;box-sizing:border-box;width:100%\"><\u002Flabel>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ block }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <div style=\"padding:14px 20px;border-top:1px solid #E3DCD0;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n                <div style=\"flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px\"><div style=\"font-size:15px;font-weight:700;overflow-wrap:anywhere\">{{ b.address }}<\u002Fdiv><div style=\"font-size:13px;color:#3D3832\">Added {{ b.added }}<\u002Fdiv><\u002Fdiv>\n                <span style=\"display:inline-flex;align-items:center;gap:6px;height:28px;box-sizing:border-box;line-height:1;padding:0 10px;border-radius:999px;border:{{ b.st.border }};background:{{ b.st.bg }};color:{{ b.st.fg }};font-size:13px;font-weight:700;white-space:nowrap\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round\"><path d=\"{{ b.st.icon }}\"><\u002Fpath><\u002Fsvg>{{ b.reason }}<\u002Fspan>\n                <sc-if value=\"{{ b.canRemove }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ b.ask }}\" style=\"height:{{ tapH }};padding:0 14px;border-radius:10px;border:2px solid #1C1916;background:#FBF9F5;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0\" style-hover=\"background:#F4EEE3\">Remove<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ b.confirming }}\" hint-placeholder-val=\"{{ false }}\">\n                <div role=\"alertdialog\" aria-label=\"Confirm remove\" style=\"padding:14px;border:2px solid #1C1916;border-radius:12px;background:#FCEFC0;display:flex;flex-direction:column;gap:12px\">\n                  <div style=\"font-size:15px;line-height:1.4\"><span style=\"font-weight:800\">Take {{ b.address }} off the block list?<\u002Fspan> We'll start sending to them again.<\u002Fdiv>\n                  <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button type=\"button\" sc-camel-on-click=\"{{ b.doIt }}\" style=\"height:44px;padding:0 16px;border-radius:10px;border:2px solid #1C1916;background:#1C1916;color:#FBF9F5;font-size:15px;font-weight:800;cursor:pointer\">Yes, remove<\u002Fbutton><button type=\"button\" sc-camel-on-click=\"{{ cancel }}\" style=\"height:44px;padding:0 16px;border-radius:10px;border:2px solid #1C1916;background:#FBF9F5;font-size:15px;font-weight:700;cursor:pointer\">Keep blocked<\u002Fbutton><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ blockEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:20px;font-size:15px;color:#3D3832\">{{ blockEmptyText }}<\u002Fdiv><\u002Fsc-if>\n        <\u002Fsection>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6B6359\">All names, addresses, domains and keys shown are fictional demo data.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ mobile }}\" hint-placeholder-val=\"{{ false }}\">\n    <nav aria-label=\"Dashboard\" style=\"flex-shrink:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px 4px 10px;background:#FBF9F5;border-top:2px solid #1C1916\">\n      <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"5\">\n        <button type=\"button\" sc-camel-on-click=\"{{ n.go }}\" aria-current=\"{{ n.current }}\" style=\"height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;border:2px solid {{ n.border }};background:{{ n.bg }};font-size:12px;font-weight:{{ n.weight }};cursor:pointer;padding:0;white-space:nowrap\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"{{ n.icon }}\"><\u002Fpath><\u002Fsvg>{{ n.label }}\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'desktop'|'mobile'&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;emails&quot;,&quot;domains&quot;,&quot;block&quot;,&quot;keys&quot;],&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;}}\">\nconst IC = {\n  check: 'M5 12.5l4.5 4.5L19 7.5',\n  bounce: 'M10 6l-5 5 5 5M5 11h9a5 5 0 0 1 0 10h-3',\n  flag: 'M6 21V4h11l-2.5 4.5L17 13H6',\n  clock: 'M12 7v5l3.5 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',\n  block: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM5.6 5.6l12.8 12.8',\n  x: 'M7 7l10 10M17 7L7 17',\n  send: 'M5 12h12M13 6l6 6-6 6',\n  retry: 'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5'\n};\nconst SOLID = '2px solid #1C1916', DASHED = '2px dashed #1C1916';\nconst ST = {\n  Queued: { bg: '#FBF9F5', fg: '#1C1916', icon: IC.clock, border: SOLID },\n  Sent: { bg: '#FBF9F5', fg: '#1C1916', icon: IC.send, border: SOLID },\n  Deferred: { bg: '#FBF9F5', fg: '#1C1916', icon: IC.retry, border: SOLID },\n  Failed: { bg: '#FBF9F5', fg: '#1C1916', icon: IC.x, border: DASHED },\n  Delivered: { bg: '#2E6B4B', fg: '#FBF9F5', icon: IC.check, border: SOLID },\n  Bounced: { bg: '#FFD6C9', fg: '#1C1916', icon: IC.bounce, border: SOLID },\n  Complained: { bg: '#F7D56E', fg: '#1C1916', icon: IC.flag, border: SOLID },\n  Verified: { bg: '#2E6B4B', fg: '#FBF9F5', icon: IC.check, border: SOLID },\n  'Pending DNS': { bg: '#FBF9F5', fg: '#1C1916', icon: IC.clock, border: SOLID },\n  'Added manually': { bg: '#FBF9F5', fg: '#1C1916', icon: IC.block, border: SOLID }\n};\nconst STATUS_ORDER = ['Queued', 'Sent', 'Deferred', 'Delivered', 'Bounced', 'Complained', 'Failed'];\nconst shortId = id => id.length > 16 ? id.slice(0, 10) + '…' + id.slice(-6) : id;\nconst NAV = [\n  { id: 'overview', label: 'Overview', icon: 'M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z' },\n  { id: 'emails', label: 'Emails', icon: 'M3 6h18v12H3zM3 7l9 6 9-6' },\n  { id: 'domains', label: 'Domains', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18' },\n  { id: 'block', label: 'Block list', icon: IC.block },\n  { id: 'keys', label: 'API keys', icon: 'M15 3a6 6 0 1 1-5.2 9L3 18.8V21h3v-2h2v-2h2l1.8-1.8A6 6 0 0 1 15 3zM16.5 7.5h.01' }\n];\nconst TITLES = {\n  overview: ['Overview', 'How your sending is going, at a glance.'],\n  emails: ['Emails', 'Every email sent from your account, newest first.'],\n  domains: ['Domains', 'The domains you send from. Each one needs a few DNS records before it can send.'],\n  block: ['Block list', \"We won't send to these addresses. Anyone who bounces or complains is added for you.\"],\n  keys: ['API keys', 'Keys let your website and apps send email. Treat them like a password.']\n};\nconst ACTION = { domains: 'Add a domain', block: 'Add an address', keys: 'Create an API key' };\nconst EMAILS = [\n  { id: 'em_9K2X7Q', to: 'mia.chen@example.com.au', subject: 'Your order #1042 is on its way', status: 'Delivered', sent: '27 Nov, 9:41 am' },\n  { id: 'em_9K2X7P', to: 'tom.walsh@example.net.au', subject: 'Booking confirmed: Sat 30 Nov, 10:00 am', status: 'Sent', sent: '27 Nov, 9:12 am' },\n  { id: 'em_9K2X6Z', to: 'accounts@example.org.au', subject: 'Invoice INV-2207 from Good Yarn Co.', status: 'Bounced', sent: '27 Nov, 8:55 am' },\n  { id: 'em_479877d2ed0963bf7b0a3a71', to: 'quotes.team@example.net.au', subject: 'Quote request received', status: 'Failed', sent: '27 Nov, 8:40 am' },\n  { id: 'em_9K2X6M', to: 'priya.k@example.com.au', subject: 'November newsletter: new wool just in', status: 'Complained', sent: '26 Nov, 12:59 pm' },\n  { id: 'em_9K2X5D', to: 'sam.oconnor@example.com.au', subject: 'Reset your password', status: 'Deferred', sent: '26 Nov, 11:18 am' },\n  { id: 'em_9K2X4R', to: 'jess.bui@example.net.au', subject: 'Your order #1041 is on its way', status: 'Queued', sent: '26 Nov, 11:02 am' },\n  { id: 'em_9K2X2A', to: 'lena.m@example.com.au', subject: 'Thanks for your review', status: 'Delivered', sent: '25 Nov, 1:30 pm' }\n];\nconst rec = (sub, found) => [\n  { type: 'TXT', name: sub || '@', value: 'v=spf1 include:spf.send.example ~all', found: found },\n  { type: 'TXT', name: 'st1._domainkey' + (sub ? '.' + sub : ''), value: 'p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC7x', found: found },\n  { type: 'MX', name: 'bounce' + (sub ? '.' + sub : ''), value: '10 feedback.send.example', found: false }\n];\nconst DOMAINS = [\n  { name: 'goodyarn.com.au', status: 'Verified', added: '2 Mar 2026', records: rec('', true).map(r => ({ ...r, found: true })) },\n  { name: 'news.goodyarn.com.au', status: 'Verified', added: '18 Jun 2026', records: rec('news', true).map(r => ({ ...r, found: true })) },\n  { name: 'shop.goodyarn.com.au', status: 'Pending DNS', added: '25 Nov 2026', records: rec('shop', false).map((r, i) => ({ ...r, found: i === 0 })) }\n];\nconst KEYS = [\n  { id: 'k1', name: 'Website contact form', prefix: 'st_live_8c2e••••••••', permission: 'Sending only', lastUsed: '2 min ago' },\n  { id: 'k2', name: 'Order receipts', prefix: 'st_live_41ab••••••••', permission: 'Sending only', lastUsed: 'today, 9:02 am' },\n  { id: 'k3', name: 'Admin scripts', prefix: 'st_live_f09d••••••••', permission: 'Full access', lastUsed: '12 Nov 2026' }\n];\nconst BLOCK = [\n  { address: 'accounts@example.org.au', reason: 'Bounced', added: '27 Nov 2026' },\n  { address: 'priya.k@example.com.au', reason: 'Complained', added: '26 Nov 2026' },\n  { address: 'info@example.com', reason: 'Bounced', added: '25 Nov 2026' },\n  { address: 'old.orders@example.net.au', reason: 'Added manually', added: '3 Nov 2026' }\n];\nconst USED = 7, LIMIT = null; // null = no monthly cap configured\n\nclass Component extends DCLogic {\n  state = { view: this.props.view || 'overview', filter: 'All', q: '', open: { 'shop.goodyarn.com.au': true }, revoked: {}, removed: {}, confirm: null, note: '', w: 0 };\n  rootRef = React.createRef();\n  scrollRef = React.createRef();\n  componentDidMount() {\n    const el = this.rootRef.current;\n    if (el && typeof ResizeObserver !== 'undefined') {\n      this.ro = new ResizeObserver(([e]) => this.setState({ w: e.contentRect.width }));\n      this.ro.observe(el);\n    }\n  }\n  componentWillUnmount() { this.ro && this.ro.disconnect(); }\n  componentDidUpdate(pp) { if (pp.view !== this.props.view && this.props.view) this.setState({ view: this.props.view }); }\n  renderVals() {\n    const s = this.state, p = this.props;\n    const forced = p.mode && p.mode !== 'auto' ? p.mode : null;\n    const mobile = forced ? forced === 'mobile' : (s.w > 0 && s.w < 760);\n    const v = s.view, ov = v === 'overview';\n    const go = id => () => this.setState({ view: id, confirm: null, note: '' }, () => { const sc = this.scrollRef.current; if (sc) sc.scrollTop = 0; });\n    const cancel = () => this.setState({ confirm: null });\n\n    const blockAll = BLOCK.filter(b => !s.removed[b.address]);\n    const nav = NAV.map(n => {\n      const on = n.id === v;\n      return { ...n, go: go(n.id), current: on ? 'page' : undefined, bg: on ? '#F7D56E' : 'transparent', border: on ? '#1C1916' : 'transparent', weight: on ? 800 : 600, count: n.id === 'block' ? String(blockAll.length) : '' };\n    });\n\n    const allEmails = EMAILS.map(e => ({ ...e, st: ST[e.status], shortId: shortId(e.id) }));\n    const filtered = ov || s.filter === 'All' ? allEmails : allEmails.filter(e => e.status === s.filter);\n    const emails = ov ? filtered.slice(0, mobile ? 3 : 6) : filtered;\n    const chips = ['All'].concat(STATUS_ORDER.filter(f => allEmails.some(e => e.status === f))).map(f => {\n      const on = s.filter === f;\n      return { label: f, count: String(f === 'All' ? allEmails.length : allEmails.filter(e => e.status === f).length), pressed: String(on), bg: on ? '#1C1916' : '#FBF9F5', fg: on ? '#FBF9F5' : '#1C1916', set: () => this.setState({ filter: f }) };\n    });\n\n    const domains = DOMAINS.map(d => {\n      const open = !ov && !!s.open[d.name];\n      return { ...d, st: ST[d.status], open, expanded: String(open), pending: d.status === 'Pending DNS', toggleLabel: open ? 'Hide DNS records' : 'Show DNS records',\n        toggle: () => this.setState(x => ({ open: { ...x.open, [d.name]: !x.open[d.name] } })),\n        records: d.records.map(r => ({ ...r, foundLabel: r.found ? 'Found' : 'Not found yet', color: r.found ? '#2E6B4B' : '#1C1916' })) };\n    });\n\n    const keys = KEYS.map(k => {\n      const revoked = !!s.revoked[k.id], confirming = s.confirm === 'k' + k.id;\n      return { ...k, revoked, confirming, canRevoke: !ov && !revoked && !confirming,\n        ask: () => this.setState({ confirm: 'k' + k.id }),\n        doIt: () => this.setState(x => ({ revoked: { ...x.revoked, [k.id]: true }, confirm: null })) };\n    });\n    const activeKeys = keys.filter(k => !k.revoked).length;\n\n    const q = s.q.trim().toLowerCase();\n    const blockFiltered = !ov && q ? blockAll.filter(b => b.address.includes(q)) : blockAll;\n    const block = (ov ? blockFiltered.slice(0, 3) : blockFiltered).map(b => {\n      const confirming = s.confirm === 'b' + b.address;\n      return { ...b, st: ST[b.reason], confirming, canRemove: !ov && !confirming,\n        ask: () => this.setState({ confirm: 'b' + b.address }),\n        doIt: () => this.setState(x => ({ removed: { ...x.removed, [b.address]: true }, confirm: null })) };\n    });\n\n    const showUsage = !mobile && ov;\n    const showEmails = ov || v === 'emails', showDomains = ov || v === 'domains', showKeys = ov || v === 'keys', showBlock = ov || v === 'block';\n    const rootH = p.height ? p.height + 'px' : (forced === 'desktop' ? 'auto' : '100vh');\n    const fmt = n => n.toLocaleString('en-AU');\n    const verified = DOMAINS.filter(d => d.status === 'Verified').length;\n\n    return {\n      rootRef: this.rootRef, scrollRef: this.scrollRef,\n      mobile, desktop: !mobile, overview: ov, nav, cancel,\n      rootDir: mobile ? 'column' : 'row', rootH, scrollOverflow: rootH === 'auto' ? 'visible' : 'auto',\n      pad: mobile ? '20px 16px 24px' : '36px 40px 48px', gap: mobile ? '16px' : '24px',\n      hdrDir: mobile ? 'column' : 'row', hdrAlign: mobile ? 'stretch' : 'flex-end', h1Size: mobile ? '30px' : '40px', tapH: mobile ? '44px' : '36px',\n      title: TITLES[v][0], subtitle: TITLES[v][1],\n      hasAction: !!ACTION[v], actionLabel: ACTION[v] || '',\n      onAction: () => this.setState({ note: `Prototype: this opens your existing “${ACTION[v]}” form.` }),\n      hasNote: !!s.note, note: s.note,\n      cols: !mobile && ov ? 'minmax(0,1.65fr) minmax(0,1fr)' : 'minmax(0,1fr)',\n      leftDisplay: mobile ? 'contents' : (showEmails || showKeys ? 'flex' : 'none'),\n      rightDisplay: mobile ? 'contents' : (showUsage || showDomains || showBlock ? 'flex' : 'none'),\n      showUsage, showEmails, showDomains, showKeys, showBlock,\n      fullEmails: v === 'emails', fullDomains: v === 'domains', fullBlock: v === 'block',\n      emails, chips, emailsTitle: ov ? 'Recent emails' : 'All emails', emailsMeta: ov ? `LATEST ${emails.length}` : `${filtered.length} SHOWN`,\n      domains, domainsMeta: `${verified}/${DOMAINS.length} VERIFIED`,\n      keys, keysMeta: `${activeKeys} ACTIVE`,\n      block, blockMeta: `${blockAll.length} ${blockAll.length === 1 ? 'ADDRESS' : 'ADDRESSES'}`, q: s.q, onQ: e => this.setState({ q: e.target.value }),\n      blockEmpty: !ov && blockFiltered.length === 0, blockEmptyText: q ? `No blocked addresses match “${s.q}”.` : \"Nobody's on your block list. Nice.\",\n      seeEmails: go('emails'), seeEmailsLabel: mobile ? 'See all' : 'See all emails', seeKeysLabel: mobile ? 'Manage' : 'Manage keys', seeDomains: go('domains'), seeKeys: go('keys'), seeBlock: go('block'),\n      hasCap: LIMIT != null, noCap: LIMIT == null,\n      used: USED, limit: LIMIT || 0, usedText: fmt(USED), limitText: LIMIT ? fmt(LIMIT) : '', leftText: LIMIT ? fmt(LIMIT - USED) : '',\n      usagePct: LIMIT ? (USED / LIMIT * 100).toFixed(1) + '%' : '0%', pctText: LIMIT ? Math.round(USED / LIMIT * 100) + '%' : '', resets: '1 Dec 2026'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
